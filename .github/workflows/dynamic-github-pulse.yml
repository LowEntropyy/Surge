name: Dynamic GitHub Pulse

# Data correctness and repository-card visual layout stay centralized in
# LowEntropyy/LowEntropyy. Dense history uses GraphQL cursor pagination; the
# shared postprocessor applies the full-width ECG + bottom vitals composition.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "55 6 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "3 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "13 7 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 18 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "25 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "33 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
    - cron: "43 22 * * *"
      timezone: "Asia/Kuala_Lumpur"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: dynamic-github-pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Run central pulse renderer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_REPO: ${{ github.repository }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MODE: repo
          SUBJECT: LowEntropyy/Surge
          LABEL: Surge
          DAYS: "14"
        run: |
          rm -rf /tmp/pulse-control
          git clone --quiet --depth 1 --branch main https://github.com/LowEntropyy/LowEntropyy.git /tmp/pulse-control

          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/pulse-control/scripts/render-pulse.sh')
          target = Path('/tmp/render-repo-pulse.sh')
          text = source.read_text()
          needle = 'test -s /tmp/pulse.svg\n'
          if text.count(needle) != 1:
              raise SystemExit('expected one pulse SVG verification hook')
          text = text.replace(
              needle,
              needle + 'python3 /tmp/pulse-control/scripts/postprocess-repo-pulse.py /tmp/pulse.svg\n',
              1,
          )
          target.write_text(text)
          PY

          bash /tmp/render-repo-pulse.sh
