<svg xmlns="http://www.w3.org/2000/svg" width="100%"
     viewBox="0 0 830 260" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">LowEntropyy/Surge's pulse — 54 bpm (revived)</title>
  <desc id="gp-desc">GitHub activity heartbeat for @LowEntropyy/Surge: 6 contributions this week, 58 in the last year.</desc>
  <style>.gp-trail{animation:gp-sweep 6.7s linear infinite}
       .gp-sweep{animation:gp-sweep 6.7s linear infinite}
       .gp-grid-pulse{animation:gp-grid-breathe 12s ease-in-out infinite}
       .gp-pill-pulse{animation:gp-pill-breathe 4.8s ease-in-out infinite}
       .gp-heart{animation:gp-thump 1.1s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
       .gp-dot{animation:gp-blink 1.8s ease-in-out infinite}
       @keyframes gp-sweep{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
       @keyframes gp-grid-breathe{0%,100%{opacity:.72}50%{opacity:.96}}
       @keyframes gp-pill-breathe{0%,100%{opacity:.72}50%{opacity:1}}
       @keyframes gp-thump{0%,100%{transform:scale(1)}15%{transform:scale(1.32)}30%{transform:scale(1)}}
       @keyframes gp-blink{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
  <defs>
    
    <filter id="gp-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gp-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="rgba(136,192,208,0.10)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="829" height="259"
        rx="12" fill="#2E3440" stroke="rgba(136,192,208,0.10)"/>
  <rect x="200" y="48" width="614" height="160" fill="url(#gp-grid)" opacity="0.9" class="gp-grid-pulse"/>

  <text x="26" y="32" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13"
        font-weight="600" fill="#ECEFF4">Surge</text>

  <rect class="gp-pill-pulse" x="737.8" y="18" width="66.2" height="19"
        rx="9.5" fill="none" stroke="#88C0D0" opacity="0.85"/>
  <text x="770.9" y="31" text-anchor="middle"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10" font-weight="600"
        fill="#88C0D0" letter-spacing="1">REVIVED</text>
  
  <line x1="190" y1="48" x2="190" y2="244" stroke="rgba(136,192,208,0.10)" stroke-width="1" opacity="0.55"/>
  <line x1="210" y1="128" x2="804" y2="128"
        stroke="rgba(136,192,208,0.10)" stroke-width="1" opacity="0.25"/>
  <path d="M210 128 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h10.5 q3 -0.5 6 0 l2 3 l4 -56 l4 64 l2 -11 q3 -3.3 6 0 h7.9 h42.4" fill="none" stroke="#88C0D0" stroke-width="1.7" opacity="0.20"/>
       <path class="gp-trail" d="M210 128 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h10.5 q3 -0.5 6 0 l2 3 l4 -56 l4 64 l2 -11 q3 -3.3 6 0 h7.9 h42.4" pathLength="1000" fill="none"
             stroke="#88C0D0" stroke-width="5.2" stroke-linecap="round"
             stroke-dasharray="250 750" opacity="0.11" filter="url(#gp-glow)"/>
       <path class="gp-sweep" d="M210 128 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h42.4 h10.5 q3 -0.5 6 0 l2 3 l4 -56 l4 64 l2 -11 q3 -3.3 6 0 h7.9 h42.4" pathLength="1000" fill="none"
             stroke="#88C0D0" stroke-width="2.6" stroke-linecap="round"
             stroke-dasharray="92 908" filter="url(#gp-glow)"/>
  <text x="800" y="64" text-anchor="end"
              font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="11" font-weight="700"
              fill="#88C0D0" filter="url(#gp-glow)">⚡ REVIVED</text>
  
  
  <text x="26" y="72" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8791A3">HEART RATE</text>
       <text class="gp-heart" x="26" y="98" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace"
           font-size="18" fill="#88C0D0">♥</text>
       <text x="48" y="98" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#88C0D0">54<tspan font-size="10"
           font-weight="400" fill="#8791A3" dx="4">bpm</tspan></text>
       <text x="26" y="120" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8791A3">OPEN PRS</text>
       <text x="26" y="146" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#88C0D0">0</text>
       <text x="26" y="168" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8791A3">OPEN ISSUES</text>
       <text x="26" y="194" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#EBCB8B">0</text>
       <text x="26" y="216" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="9.5"
           letter-spacing="1.4" fill="#8791A3">STREAK · TYPE</text>
       <text x="26" y="242" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="24"
           font-weight="700" fill="#ECEFF4">1d<tspan
           fill="#8791A3" font-size="16" dx="8">??+</tspan></text>
  <text x="804" y="238" text-anchor="end"
        font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5" fill="#88C0D0"
        >⚡ back from the dead</text>
  
  
</svg>